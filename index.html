<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id.ly | المنصة الرقمية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.2);
        }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card-content h2 {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            color: var(--accent-color);
        }
        .card-content p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>id.ly</h1>
        <p class="subtitle">بوابة المشاريع والأنظمة الرقمية المستقلة</p>
        
        <div class="grid">
            <!-- رابط المدونة -->
            <a href="https://blog.ly.id.ly" class="card">
                <img class="card-img" src="https://cdn.pixabay.com/photo/2015/07/17/22/43/student-849822_1280.jpg" alt="المدونة">
                <div class="card-content">
                    <h2>المدونة الرقمية</h2>
                    <p>مقالات تقنية، أفكار برمجية، وتوثيق حصرى للمشاريع الذكية.</p>
                </div>
            </a>

            <!-- رابط التطبيق -->
            <a href="https://app.ly.id.ly" class="card">
                <img class="card-img" src="https://cdn.pixabay.com/photo/2016/11/19/14/00/code-1839406_1280.jpg" alt="التطبيق">
                <div class="card-content">
                    <h2>التطبيق الذكي</h2>
                    <p>بيئة العمل السحابية والأدوات المؤتمتة لإدارة المحتوى والأصول.</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
